name: Publish JavaScript demo

on:
  push:
    branches:
      - main
    paths:
      - "jsdemo/**"
      - ".github/workflows/publish-jsdemo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Check out GitHub Pages repository
        uses: actions/checkout@v4
        with:
          repository: mhulden/mhulden.github.io
          ref: main
          token: ${{ secrets.PAGES_REPO_TOKEN }}
          path: pages-site

      - name: Copy demo files
        run: |
          rm -rf pages-site/bimachine-learning-jsdemo
          mkdir -p pages-site/bimachine-learning-jsdemo
          rsync -a --exclude='test/' jsdemo/ pages-site/bimachine-learning-jsdemo/

      - name: Publish changes
        run: |
          git -C pages-site config user.name "github-actions[bot]"
          git -C pages-site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages-site add bimachine-learning-jsdemo
          if git -C pages-site diff --cached --quiet; then
            echo "No demo changes to publish."
          else
            git -C pages-site commit -m "Publish bimachine-learning JavaScript demo"
            git -C pages-site push origin main
          fi
